name: Update data

on:
  schedule:
    - cron: "17 */6 * * *"   # 每 6 小时一次（UTC），避开整点高峰
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch
        env:
          # 默认用内置 token；想要更高额度可在仓库 Secrets 里配置 GH_PAT
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python scripts/fetch.py

      - name: Enrich
        # 没配置 ANTHROPIC_API_KEY 时脚本会直接跳过，不影响抓取
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENRICH_MODEL: ${{ vars.ENRICH_MODEL || 'claude-haiku-5-5' }}
        run: |
          pip install --quiet anthropic
          python scripts/enrich.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "数据无变化"
          else
            git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
